<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Launch Gantt</title>
<style>
  :root {
    --bg: #ffffff; --fg: #2f3437; --muted: #8a8f94; --line: #ececea; --line-strong: #dcdcd8;
    --weekend: #f8f8f7; --group: #f4f4f2;
    --best: #5fb98b; --cons: #f1c75b; --done: #9a6dd7; --today: #e5534b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #191919; --fg: #e6e6e4; --muted: #8f8f8c; --line: #2a2a2a; --line-strong: #383838;
            --weekend: #1f1f1f; --group: #232323; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 13px/1.35 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; padding: 12px 14px 10px; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .legend { display: flex; gap: 14px; color: var(--muted); font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 14px; height: 8px; border-radius: 3px; display: inline-block; }
  .note { color: var(--muted); font-size: 11px; margin-left: auto; }
  .wrap { overflow-x: auto; border-top: 1px solid var(--line-strong); }
  .grid { display: grid; position: relative; }
  .label { position: sticky; left: 0; z-index: 2; background: var(--bg); padding: 0 10px 0 14px;
           border-right: 1px solid var(--line-strong); display: flex; align-items: center; gap: 8px;
           white-space: nowrap; overflow: hidden; }
  .label .name { overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .row { height: 32px; border-bottom: 1px solid var(--line); }
  .grouprow .label, .grouprow.track { background: var(--group); font-weight: 600; }
  .grouprow .count { color: var(--muted); font-weight: 400; }
  .track { position: relative; }
  .head { position: sticky; top: 0; z-index: 3; background: var(--bg); height: 44px; border-bottom: 1px solid var(--line-strong); }
  .head .label { color: var(--muted); font-size: 12px; z-index: 4; }
  .month { position: absolute; top: 4px; font-size: 12px; font-weight: 600; padding-left: 4px; }
  .wk { position: absolute; top: 24px; font-size: 11px; color: var(--muted); padding-left: 3px; border-left: 1px solid var(--line-strong); height: 20px; }
  .bg { position: absolute; top: 0; bottom: 0; pointer-events: none; }
  .bar { position: absolute; top: 8px; height: 16px; display: flex; border-radius: 4px; overflow: hidden; cursor: default;
         box-shadow: 0 0 0 1px rgba(0,0,0,.04); }
  .bar > div { height: 100%; }
  .bar:hover { filter: brightness(1.05); box-shadow: 0 0 0 2px rgba(0,0,0,.12); }
  .ms { position: absolute; top: 9px; width: 14px; height: 14px; transform: rotate(45deg); border-radius: 2px; }
  .today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--today); opacity: .7; pointer-events: none; z-index: 1; }
  #tip { position: fixed; pointer-events: none; z-index: 10; background: #2f3437; color: #fff; padding: 8px 10px;
         border-radius: 6px; font-size: 12px; line-height: 1.5; box-shadow: 0 4px 14px rgba(0,0,0,.2); display: none; max-width: 300px; }
  #tip b { display: block; margin-bottom: 2px; }
  #tip .k { color: #b5b9bd; }
  #refresh { border: 1px solid var(--line-strong); background: transparent; color: var(--muted); border-radius: 4px;
             cursor: pointer; font-size: 12px; padding: 0 6px; margin-left: 6px; }
  #refresh:hover { color: var(--fg); }
  .label a { color: inherit; text-decoration: none; }
  .label a:hover { text-decoration: underline; }
  .msg { padding: 24px 14px; color: var(--muted); }
  .grouprow.label { cursor: pointer; user-select: none; }
  .chev { display: inline-block; width: 12px; color: var(--muted); font-size: 10px; transition: transform .15s; }
  .collapsed .chev { transform: rotate(-90deg); }
  .gbar { position: absolute; top: 10px; height: 12px; border-radius: 3px; }
  .gbar.cons { opacity: .9; }
  .seg { position: absolute; top: 0; height: 100%; border-radius: 4px; }
  .conflict { outline: 2px solid var(--today); outline-offset: 1px; }
  .tools button { border: 1px solid var(--line-strong); background: transparent; color: var(--muted); border-radius: 4px;
                  cursor: pointer; font-size: 11px; padding: 1px 6px; margin-left: 4px; }
  .tools button:hover { color: var(--fg); }
  .msg.err { color: var(--today); }
  .tools select { border: 1px solid var(--line-strong); background: var(--bg); color: var(--fg); border-radius: 4px;
                  font-size: 11px; padding: 1px 4px; margin-left: 4px; }
  .ghost { position: absolute; top: 27px; height: 3px; display: flex; border-radius: 2px; overflow: hidden; pointer-events: none; }
  .grouprow .ghost { top: 25px; }
  .ghost > div { height: 100%; }
  #vary { padding: 0 14px 12px; }
  #vary .vhead { display: flex; align-items: baseline; gap: 10px; font-size: 12px; color: var(--muted); margin-bottom: 8px; cursor: pointer; user-select: none; }
  #vary .vhead b { color: var(--fg); font-weight: 600; }
  #vary.closed .tiles { display: none; }
  #vary.closed .chev { transform: rotate(-90deg); }
  .tiles { display: flex; flex-wrap: wrap; gap: 8px; }
  .tile { border: 1px solid var(--line-strong); border-radius: 6px; padding: 7px 10px 6px; min-width: 170px; flex: 0 1 200px; }
  .tile.total { background: var(--group); }
  .tile .tn { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .tv { font-size: 18px; font-weight: 600; line-height: 1.3; }
  .tile .tv small { font-size: 11px; font-weight: 400; color: var(--muted); }
  .tile .td { font-size: 11px; color: var(--muted); min-height: 15px; }
  .tile .td .good { color: #2f9e6e; } .tile .td .bad { color: var(--today); }
  .tile svg { display: block; margin-top: 2px; overflow: visible; }
  .spark-line { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .spark-pt { fill: var(--muted); } .spark-pt.live { fill: var(--bg); stroke: var(--fg); stroke-width: 2; }
  .spark-pt.sel { fill: var(--fg); }
  .spark-hit { fill: transparent; cursor: default; }
</style>
</head>
<body>
<header>
  <h1 id="title">Project</h1>
  <div class="legend">
    <span><i class="sw" style="background:var(--best)"></i>Optimistic</span>
    <span><i class="sw" style="background:var(--cons)"></i>Conservative</span>
    <span><i class="sw" style="background:var(--done)"></i>Done</span>
    <span id="ghostLegend" style="display:none"><i class="sw" style="height:3px;background:linear-gradient(90deg,var(--best) 50%,var(--cons) 50%)"></i><span></span></span>
  </div>
  <div class="tools"><button id="expandAll">Expand all</button><button id="collapseAll">Collapse all</button>
    <span id="snapTools" style="display:none"><select id="snap" title="Compare with a past week's plan"></select><button id="saveSnap" title="Save this week's snapshot now">Save snapshot</button></span></div>
  <div class="note"><span id="updated">Loading…</span> <button id="refresh" title="Reload from Notion">↻</button></div>
</header>
<div id="vary" style="display:none"></div>
<div class="wrap"><div class="grid" id="g"></div></div>
<div id="tip"></div>
<script>
let PHASE_ORDER = [];   // filled from Notion: the order of the Phase options
const STATUS_COLOR = {"Not started":"#9b9a97","In progress":"#529cca","At risk":"#e5534b","Done":"#4dab9a"};
const DAY = 86400000, LABEL_W = 320;
let PX = 9;   // pixels per day; shrinks for long projects
const d = s => Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10));
const fmt = t => new Date(t).toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"});
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const el = (cls, html = "", style = "") => { const e = document.createElement("div"); e.className = cls; e.innerHTML = html; if (style) e.style.cssText = style; return e; };
const g = document.getElementById("g"), tip = document.getElementById("tip"), updated = document.getElementById("updated");

// Collapsed groups are remembered per browser (best effort; storage can be unavailable in embeds).
let collapsed = new Set();
try { collapsed = new Set(JSON.parse(localStorage.getItem("gantt-collapsed") || "[]")); } catch {}
const saveCollapsed = () => { try { localStorage.setItem("gantt-collapsed", JSON.stringify([...collapsed])); } catch {} };

let TASKS = [], LIVE = null, SNAPS = [], SNAPS_INFO = null, COMPARE = null;
const chartKey = () => new URLSearchParams(location.search).get("key") || new URLSearchParams(location.hash.slice(1)).get("key") || "";
async function api(path, opts = {}) {
  const r = await fetch(path, { cache: "no-store", ...opts, headers: { "x-chart-key": chartKey(), ...(opts.headers || {}) } });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
async function load() {
  updated.textContent = "Loading…";
  try {
    // The key can come as ?key=… (needed for Notion embeds, which drop the #part) or #key=….
    const key = new URLSearchParams(location.search).get("key") || new URLSearchParams(location.hash.slice(1)).get("key") || "";
    const r = await fetch("/api/tasks", { cache: "no-store", headers: { "x-chart-key": key } });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.statusText);
    TASKS = data.tasks.filter(t => t.bestStart);
    PHASE_ORDER = data.phaseOrder || [];
    LIVE = data.spreads || null;
    if (data.title) { document.getElementById("title").textContent = (data.icon ? data.icon + " " : "") + data.title; document.title = data.title; }
    render();
    const time = new Date(data.fetchedAt).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
    const sync = data.sync || {};
    updated.innerHTML = esc("Live from Notion · updated " + time) +
      (sync.ok === false ? ` · <span style="color:var(--today)" title="${esc(sync.message)}">⚠ dates not saved to Notion</span>`
        : sync.updated ? ` · ${sync.updated} task${sync.updated === 1 ? "" : "s"} updated in Notion` : "");
    loadSnapshots();
  } catch (e) {
    g.innerHTML = ""; g.style.gridTemplateColumns = "1fr";
    g.append(el("msg err", "Couldn't load tasks from Notion: " + esc(e.message)));
    updated.textContent = "";
  }
}
document.getElementById("refresh").onclick = load;
addEventListener("hashchange", load);
const phaseOf = t => t.phase || "No phase";
document.getElementById("collapseAll").onclick = () => { collapsed = new Set(TASKS.map(phaseOf)); saveCollapsed(); render(); };
document.getElementById("expandAll").onclick = () => { collapsed.clear(); saveCollapsed(); render(); };

// One task's two schedules as UTC ms (ends are inclusive days). Dates come from the server-side scheduler.
function spans(t) {
  const s = d(t.bestStart), b = d(t.bestEnd), cs = d(t.consStart), ce = d(t.consEnd);
  return { s, b, cs, ce, conflict: false };
}

function render() {
  g.innerHTML = "";
  const gl = document.getElementById("ghostLegend");
  gl.style.display = COMPARE ? "" : "none";
  if (COMPARE) gl.lastElementChild.textContent = "Thin line = plan as of " + fmt(d(COMPARE.week));
  if (!TASKS.length) { g.style.gridTemplateColumns = "1fr"; g.append(el("msg", "No tasks with a Start date yet.")); return; }
  const byId = Object.fromEntries(TASKS.map(t => [t.id.replace(/-/g, ""), t]));

  let min = Math.min(...TASKS.map(t => Math.min(d(t.bestStart), d(t.consStart))));
  let max = Math.max(...TASKS.map(t => { const p = spans(t); return Math.max(p.b, p.ce, p.cs); }));
  const snapById = {};
  for (const t of COMPARE?.tasks || []) if (t.bestStart) {
    snapById[t.id] = t;
    min = Math.min(min, d(t.bestStart)); max = Math.max(max, d(t.bestEnd), d(t.consEnd));
  }
  min -= ((new Date(min).getUTCDay() + 6) % 7) * DAY;
  max += (7 - new Date(max).getUTCDay()) % 7 * DAY + 7 * DAY;
  const days = Math.round((max - min) / DAY) + 1;
  PX = Math.max(3, Math.min(9, Math.floor(1300 / days)));   // long projects get narrower days
  const x = t => Math.round((t - min) / DAY) * PX;
  const w = (a, b) => x(b + DAY) - x(a);           // width of an inclusive day range
  g.style.gridTemplateColumns = `${LABEL_W}px ${days * PX}px`;

  g.append(el("label head", "Task"));
  const head = el("track head");
  let lastMonth = -1, lastWk = -99;
  const monthFmt = PX < 6 ? {month:"short",year:"2-digit",timeZone:"UTC"} : {month:"long",year:"numeric",timeZone:"UTC"};
  for (let i = 0; i < days; i++) {
    const t = min + i * DAY, dt = new Date(t);
    if (dt.getUTCMonth() !== lastMonth) {
      lastMonth = dt.getUTCMonth();
      if (head.lastMonthEl && x(t) - head.lastMonthX < 56) head.lastMonthEl.remove();   // drop a squeezed partial month
      head.lastMonthEl = el("month", dt.toLocaleDateString("en-US", monthFmt), `left:${x(t)}px`); head.lastMonthX = x(t);
      head.append(head.lastMonthEl);
    }
    if (dt.getUTCDay() === 1 && x(t) - lastWk >= 24) { head.append(el("wk", dt.getUTCDate(), `left:${x(t)}px`)); lastWk = x(t); }
  }
  g.append(head);

  // A thin line under a bar = the same task as planned in the compared week.
  const ghost = (s, b, ce, done) => {
    const hi = Math.max(b, ce), gEl = el("ghost", "", `left:${x(s)}px;width:${w(s, hi)}px`);
    gEl.append(el("", "", `width:${w(s, b)}px;background:${done ? "var(--done)" : "var(--best)"}`));
    if (ce > b) gEl.append(el("", "", `width:${w(b + DAY, ce)}px;background:${done ? "var(--done)" : "var(--cons)"}`));
    return gEl;
  };
  const was = t => t && { s: d(t.bestStart), b: d(t.bestEnd), ce: d(t.consEnd), done: t.status === "Done" };

  const bgFor = () => {
    const frag = document.createDocumentFragment();
    for (let i = 0; i < days; i++) {
      const t = min + i * DAY, wd = new Date(t).getUTCDay();
      if (wd === 0 || wd === 6) frag.append(el("bg", "", `left:${x(t)}px;width:${PX}px;background:var(--weekend)`));
      if (wd === 1) frag.append(el("bg", "", `left:${x(t)}px;width:1px;background:var(--line)`));
    }
    return frag;
  };

  const phases = [...new Set(TASKS.map(phaseOf))]
    .sort((a, b) => (PHASE_ORDER.indexOf(a) + 1 || 99) - (PHASE_ORDER.indexOf(b) + 1 || 99) || a.localeCompare(b));

  for (const ph of phases) {
    const rows = TASKS.filter(t => phaseOf(t) === ph).sort((a,b) => d(a.bestStart) - d(b.bestStart) || d(a.bestEnd) - d(b.bestEnd));
    const isCollapsed = collapsed.has(ph);
    const allDone = rows.every(t => t.status === "Done");
    const sp = rows.map(spans);
    const grp = {
      s: Math.min(...sp.map(p => p.s)), b: Math.max(...sp.map(p => p.b)),
      cs: Math.min(...sp.map(p => p.cs)), ce: Math.max(...sp.map(p => p.ce)),
    };
    const doneCount = rows.filter(t => t.status === "Done").length;

    // Group header row with its own summary bar
    const gl = el("label row grouprow" + (isCollapsed ? " collapsed" : ""), `<span class="chev">▼</span>${esc(ph)} <span class="count">${doneCount}/${rows.length} done</span>`);
    gl.title = isCollapsed ? "Expand" : "Collapse";
    gl.onclick = () => { isCollapsed ? collapsed.delete(ph) : collapsed.add(ph); saveCollapsed(); render(); };
    g.append(gl);
    const gt = el("track row grouprow"); gt.append(bgFor());
    const consColor = allDone ? "var(--done)" : "var(--cons)", bestColor = allDone ? "var(--done)" : "var(--best)";
    // Yellow runs straight on from the day after green ends to the conservative finish.
    const gc = el("gbar cons", "", grp.ce > grp.b ? `left:${x(grp.b + DAY)}px;width:${w(grp.b + DAY, grp.ce)}px;background:${consColor};${allDone ? "opacity:.55" : ""}` : "display:none");
    const gb = el("gbar", "", `left:${x(grp.s)}px;width:${w(grp.s, grp.b)}px;background:${bestColor}`);
    gt.append(gc, gb);
    const gtip = {
      title: `${ph} (${rows.length} tasks)`,
      lines: [
        ["Status", `${doneCount} of ${rows.length} done`],
        ["Optimistic", `${fmt(grp.s)} → ${fmt(grp.b)}`],
        ["Conservative", `${fmt(grp.s)} → ${fmt(grp.ce)}`],
      ],
    };
    if (COMPARE) {
      const old = (COMPARE.tasks || []).filter(t => t.bestStart && (t.phase || "No phase") === ph).map(was);
      if (old.length) {
        const o = { s: Math.min(...old.map(p => p.s)), b: Math.max(...old.map(p => p.b)), ce: Math.max(...old.map(p => p.ce)) };
        gt.append(ghost(o.s, o.b, o.ce, old.every(p => p.done)));
        gtip.lines.push([weekLabel(COMPARE.week), `${fmt(o.b)} optimistic · ${fmt(o.ce)} conservative`]);
      }
    }
    hook(gb, gtip); hook(gc, gtip);
    g.append(gt);
    if (isCollapsed) continue;

    rows.forEach((t, i) => {
      const p = sp[i];
      const lab = el("label row", `<i class="dot" style="background:${STATUS_COLOR[t.status] || "#9b9a97"}"></i><a class="name" href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.name) || "Untitled"}</a>`);
      lab.title = t.name;
      g.append(lab);
      const tr = el("track row"); tr.append(bgFor());
      const done = t.status === "Done";
      const blockers = (t.blockedBy || []).map(id => byId[id.replace(/-/g, "")]?.name).filter(Boolean);
      const info = {
        title: t.name,
        lines: [
          ["Status", `${t.status || "—"}${t.progress != null ? " · " + Math.round(t.progress*100) + "%" : ""}`],
          t.owner && ["Owner", t.owner],
          ["Optimistic", `${fmt(p.s)} → ${fmt(p.b)}${t.bestDays ? ` (${t.bestDays} working days)` : ""}`],
          ["Conservative", `${fmt(p.cs)} → ${fmt(p.ce)}${t.consDays ? ` (${t.consDays} working days)` : ""}`],
          blockers.length && ["Waits for", blockers.join(", ")],
          t.earliestStart && ["Not before", fmt(d(t.earliestStart))],
          (t.actualStart || t.actualEnd) && ["Actual", `${t.actualStart ? fmt(d(t.actualStart)) : "?"} → ${t.actualEnd ? fmt(d(t.actualEnd)) : "?"}`],
          ...(t.issues || []).map(i => ["⚠", i]),
        ].filter(Boolean),
      };
      const old = was(snapById[t.id]);
      if (COMPARE) {
        if (old) { tr.append(ghost(old.s, old.b, old.ce, old.done)); info.lines.push([weekLabel(COMPARE.week), `${fmt(old.s)} → ${fmt(old.b)} optimistic · ${fmt(old.ce)} conservative`]); }
        else info.lines.push([weekLabel(COMPARE.week), "not in the plan yet"]);
      }
      if (p.s === p.b && p.ce <= p.b) {
        const m = el("ms", "", `left:${x(p.s) + PX/2 - 7}px;background:${done ? "var(--done)" : "var(--best)"}`);
        hook(m, info); tr.append(m);
      } else {
        // Green = optimistic; yellow runs straight on from the day after green ends to the conservative finish.
        const hi = Math.max(p.b, p.ce);
        const bar = el("bar" + ((t.issues || []).length ? " conflict" : ""), "", `left:${x(p.s)}px;width:${w(p.s, hi)}px;border-radius:4px`);
        bar.append(el("", "", `width:${w(p.s, p.b)}px;background:${done ? "var(--done)" : "var(--best)"}`));
        if (p.ce > p.b) bar.append(el("", "", `width:${w(p.b + DAY, p.ce)}px;background:${done ? "var(--done)" : "var(--cons)"};${done ? "opacity:.6" : ""}`));
        hook(bar, info); tr.append(bar);
      }
      g.append(tr);
    });
  }

  const now = new Date(), today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  if (today >= min && today <= max) g.append(el("today", "", `left:${LABEL_W + x(today)}px`));
}

// ---------- Snapshots ----------
const snapSel = document.getElementById("snap"), vary = document.getElementById("vary");
const weekLabel = w => "Week of " + fmt(d(w));
async function loadSnapshots(selectId) {
  try {
    const data = await api("/api/snapshots");
    SNAPS_INFO = data;
    SNAPS = data.snapshots || [];
  } catch (e) { SNAPS_INFO = { available: false, message: e.message }; SNAPS = []; }
  document.getElementById("snapTools").style.display = SNAPS_INFO.available ? "" : "none";
  const keep = selectId ?? snapSel.value;
  snapSel.innerHTML = `<option value="">Compare with… (none)</option>` +
    SNAPS.map(s => `<option value="${esc(s.id)}">${esc(weekLabel(s.week))}</option>`).join("");
  snapSel.value = SNAPS.some(s => s.id === keep) ? keep : "";
  if (!snapSel.value && COMPARE) { COMPARE = null; render(); }
  renderVariability();
}
snapSel.onchange = async () => {
  const id = snapSel.value;
  if (!id) { COMPARE = null; render(); renderVariability(); return; }
  updated.dataset.prev = updated.innerHTML; updated.textContent = "Loading snapshot…";
  try { COMPARE = await api("/api/snapshots?id=" + encodeURIComponent(id)); }
  catch (e) { COMPARE = null; alert("Couldn't load that snapshot: " + e.message); }
  updated.innerHTML = updated.dataset.prev;
  render(); renderVariability();
};
document.getElementById("saveSnap").onclick = async e => {
  const b = e.target; b.disabled = true; b.textContent = "Saving…";
  try { const r = await api("/api/snapshots", { method: "POST" }); await loadSnapshots(); b.textContent = "Saved ✓"; }
  catch (err) { b.textContent = "Save snapshot"; alert("Couldn't save the snapshot: " + err.message); }
  setTimeout(() => { b.textContent = "Save snapshot"; b.disabled = false; }, 2000);
};

let varyOpen = true;
try { varyOpen = localStorage.getItem("gantt-vary") !== "closed"; } catch {}
function renderVariability() {
  if (!LIVE || !SNAPS_INFO?.available) { vary.style.display = "none"; return; }
  vary.style.display = "";
  vary.className = varyOpen ? "" : "closed";
  const hist = [...SNAPS].reverse();                       // oldest → newest
  const ref = COMPARE ? SNAPS.find(s => s.id === snapSel.value) : SNAPS[0];
  const refText = ref ? (COMPARE ? "vs " : "vs last snapshot, ") + fmt(d(ref.week)) : "";
  vary.innerHTML = `<div class="vhead"><span class="chev">▼</span><b>Spread</b><span>working days between the optimistic and conservative finish · smaller is more certain${SNAPS.length ? "" : " · history starts with your first snapshot"}</span></div>`;
  vary.querySelector(".vhead").onclick = () => { varyOpen = !varyOpen; try { localStorage.setItem("gantt-vary", varyOpen ? "open" : "closed"); } catch {} renderVariability(); };
  const tiles = el("tiles");
  const series = [{ name: LIVE.overall?.name || "Whole project", live: LIVE.overall, get: s => s.overall, total: true },
                  ...LIVE.phases.map(ph => ({ name: ph.name, live: ph, get: s => s.phases.find(x => x.name === ph.name) }))];
  for (const ser of series) {
    if (!ser.live) continue;
    const pts = hist.map(s => ({ label: weekLabel(s.week), id: s.id, v: ser.get(s)?.spread })).filter(p => p.v != null);
    pts.push({ label: "Today (live)", v: ser.live.spread, live: true });
    const then = ref ? ser.get(ref)?.spread : null;
    let delta = "";
    if (then != null) {
      const dv = ser.live.spread - then;
      delta = dv === 0 ? `no change ${esc(refText)}`
        : `<span class="${dv < 0 ? "good" : "bad"}">${dv < 0 ? "▼" : "▲"} ${Math.abs(dv)} day${Math.abs(dv) === 1 ? "" : "s"} ${dv < 0 ? "narrower" : "wider"}</span> ${esc(refText)}`;
    }
    const done = ser.live.total && ser.live.done === ser.live.total;
    const t = el("tile" + (ser.total ? " total" : ""),
      `<div class="tn" title="${esc(ser.name)}">${esc(ser.name)}</div>
       <div class="tv">${ser.live.spread} <small>working days${done ? " · done" : ""}</small></div>
       <div class="td">${delta}</div>`);
    if (pts.length > 1) t.append(spark(pts, ser.name));
    tiles.append(t);
  }
  vary.append(tiles);
}
function spark(pts, name) {
  const W = 176, H = 34, pad = 5;
  const max = Math.max(1, ...pts.map(p => p.v));
  const X = i => pts.length === 1 ? W / 2 : pad + i * (W - 2 * pad) / (pts.length - 1);
  const Y = v => H - pad - (v / max) * (H - 2 * pad);
  const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg");
  svg.setAttribute("width", W); svg.setAttribute("height", H); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", `${name} spread: ` + pts.map(p => `${p.label} ${p.v} days`).join(", "));
  const mk = (tag, attrs) => { const e = document.createElementNS(ns, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.append(e); return e; };
  mk("line", { x1: pad, x2: W - pad, y1: H - pad, y2: H - pad, stroke: "var(--line-strong)", "stroke-width": 1 });
  if (pts.length > 1) mk("polyline", { class: "spark-line", points: pts.map((p, i) => `${X(i)},${Y(p.v)}`).join(" ") });
  pts.forEach((p, i) => {
    mk("circle", { class: "spark-pt" + (p.live ? " live" : "") + (p.id && p.id === snapSel.value ? " sel" : ""), cx: X(i), cy: Y(p.v), r: p.live ? 3.5 : 3 });
    const hit = mk("circle", { class: "spark-hit", cx: X(i), cy: Y(p.v), r: 9 });
    hook(hit, { title: p.label, lines: [["Spread", `${p.v} working day${p.v === 1 ? "" : "s"}`]] });
  });
  return svg;
}

function hook(node, info) {
  node.addEventListener("mousemove", e => {
    tip.innerHTML = `<b>${esc(info.title)}</b>` + info.lines.map(([k, v]) => `<span class="k">${esc(k)}:</span> ${esc(v)}`).join("<br>");
    tip.style.display = "block";
    const r = tip.getBoundingClientRect();
    tip.style.left = Math.min(e.clientX + 12, innerWidth - r.width - 8) + "px";
    tip.style.top = Math.min(e.clientY + 14, innerHeight - r.height - 8) + "px";
  });
  node.addEventListener("mouseleave", () => tip.style.display = "none");
}

load();
</script>
</body>
